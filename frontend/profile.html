<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - KrishiMart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <a class="brand" href="index.html">KrishiMart</a>
    <nav id="nav-links"></nav>
</div>

<div class="container">
    <div class="form-card">
        <h2>My Profile</h2>
        <form id="profileForm">
            <label for="name">Full name</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" disabled>

            <label for="phone">Phone number</label>
            <input type="text" id="phone">

            <label for="state">State</label>
            <select id="state" required>
                <option value="">Select your state</option>
                <option>Andhra Pradesh</option>
                <option>Bihar</option>
                <option>Delhi</option>
                <option>Gujarat</option>
                <option>Haryana</option>
                <option>Jharkhand</option>
                <option>Karnataka</option>
                <option>Kerala</option>
                <option>Madhya Pradesh</option>
                <option>Maharashtra</option>
                <option>Odisha</option>
                <option>Punjab</option>
                <option>Rajasthan</option>
                <option>Tamil Nadu</option>
                <option>Telangana</option>
                <option>Uttar Pradesh</option>
                <option>Uttarakhand</option>
                <option>West Bengal</option>
            </select>

            <label for="city">City / District</label>
            <select id="city" required disabled>
                <option value="">Select your state first</option>
            </select>

            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.3rem;">Save changes</button>
            <p class="form-msg" id="msg"></p>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
